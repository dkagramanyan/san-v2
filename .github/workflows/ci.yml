name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Must satisfy this package's requires-python (>= 3.12, matching combra).
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Must satisfy this package's requires-python (>= 3.12, matching combra).
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch is enough for the CPU smoke tests.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      # combra is a private repo. When a read-access token is configured as the
      # COMBRA_TOKEN secret, install it and set COMBRA_REQUIRED so an absent combra
      # becomes a test FAILURE rather than a skip; without the secret the contract
      # test still skips, so a fork's PR keeps building. Base `combra` is enough:
      # CI never runs the image metrics, so the [metrics] extra is not needed here.
      - name: Install combra (arms tests/test_combra_contract.py)
        env:
          COMBRA_TOKEN: ${{ secrets.COMBRA_TOKEN }}
        run: |
          if [ -n "$COMBRA_TOKEN" ]; then
            pip install "combra @ git+https://x-access-token:${COMBRA_TOKEN}@github.com/dkagramanyan/combra.git"
            echo "COMBRA_REQUIRED=1" >> "$GITHUB_ENV"
          else
            echo "COMBRA_TOKEN not set -- the combra contract test will skip."
          fi
      - name: Run tests
        run: python -m pytest tests/ -v
